name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install --workspaces --include-workspace-root

      - name: Test all workspaces
        run: npm test --workspaces --if-present

      - name: Verify dist/ is up to date with sources
        run: |
          npm run build:plugins
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run \`npm run build:plugins\` locally and commit the changes."
            git diff --stat -- dist
            exit 1
          fi

  changeset-enforcement:
    name: Core changeset enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify core PR has a changeset entry
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-core-changeset.mjs

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # NB: no `id-token: write`. With it set, npm 9.5+ tries OIDC trusted
    # publishing before falling back to NPM_TOKEN — for packages that
    # don't yet exist on npm and have no trusted-publisher configured,
    # that path returns confusing 404s instead of a clean auth path.
    # First-publish goes via the classic NPM_TOKEN flow only.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install
        run: npm install --workspaces --include-workspace-root

      - name: Verify npm auth (diagnostic)
        # Smoke-tests that NPM_TOKEN reaches the registry before changesets
        # tries to publish. If this step prints the wrong username (or fails
        # outright), the token in GitHub Secrets isn't the one you think it
        # is — the changesets step would otherwise return opaque 404s on
        # PUT to scoped packages and not tell you why.
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run changeset:publish
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
